plugins {
    id "com.android.library"
    // Flutter's build infrastructure applies KGP automatically (built-in Kotlin).
    // Do NOT add "org.jetbrains.kotlin.android" here — it triggers a deprecation
    // warning and will break in future Flutter versions.
    // See: https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
}

group = "dev.shreeman.nitro_fold_duo"
version = "1.0"

android {
    namespace = "dev.shreeman.nitro_fold_duo"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    externalNativeBuild {
        cmake { path = "../src/CMakeLists.txt" }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        // Flutter's profile variant: without an explicit profile buildType,
        // AGP builds the plugin's CMake code with the DEBUG config — the
        // whole native library ships at -O0 in profile mode. Inherit release
        // so profile builds measure optimized native code.
        profile {
            initWith release
        }
    }

    defaultConfig {
            consumerProguardFiles "consumer-rules.pro"
 minSdk = 24 }

    sourceSets {
        main {
            // Do NOT add to java.srcDirs — in AGP 8.x that routes .kt files
            // through the Java compiler and causes "Unresolved reference" errors.
            kotlin.srcDirs += "${project.projectDir}/../lib/src/generated/kotlin"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    // Jetpack WindowManager reports the fold on Android foldables, the way
    // UIKit's reserved regions do on iPhone Duo.
    implementation "androidx.window:window:1.3.0"
}
