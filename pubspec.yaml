name: nitro_fold_duo
description: iPhone Duo support for Flutter backed by UIKit's reserved-region, hinge and vertical-bar APIs over Nitro FFI, with fold-aware layout and Liquid Glass chrome.
version: 0.0.1
homepage: https://github.com/Shreemanarjun/nitro_fold_duo
repository: https://github.com/Shreemanarjun/nitro_fold_duo
issue_tracker: https://github.com/Shreemanarjun/nitro_fold_duo/issues
documentation: https://github.com/Shreemanarjun/nitro_fold_duo/blob/main/README.md
funding:
  - https://buymeacoffee.com/shreemanarjun
topics:
  - foldable
  - iphone-duo
  - ffi
  - nitro
  - layout
screenshots:
  - description: 'The vertical bar on the outer display: toolbar groups, the system overflow capsule and the tab bar, as Liquid Glass capsules.'
    path: doc/screenshots/outer-display.png
  - description: 'The inner display partially folded. DuoSplit puts each pane on its own side of the crease and leaves the reserved band empty.'
    path: doc/screenshots/inner-folded.png
  - description: 'The inner display open flat. With no fold to divide it, the panes share the box side by side.'
    path: doc/screenshots/inner-open.png
  - description: 'A Flutter dialog kept clear of the crease, because DuoDisplayFeatures published the fold into MediaQuery.'
    path: doc/screenshots/fold-aware-dialog.png
  - description: 'Everything the bridge reports: posture, hinge angle, bar edge, corner insets and every reserved region.'
    path: doc/screenshots/duo-state.png

environment:
  sdk: ^3.13.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  nitro: ^0.7.6
  plugin_platform_interface: ^2.0.2
  signals_flutter: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  nitro_generator: ^0.7.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      android:
        pluginClass: NitroFoldDuoPlugin
        package: dev.shreeman.nitro_fold_duo
        ffiPlugin: true
      ios:
        pluginClass: SwiftNitroFoldDuoPlugin
        ffiPlugin: true
      macos:
        pluginClass: SwiftNitroFoldDuoPlugin
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
